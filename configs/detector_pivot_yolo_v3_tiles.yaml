dataset:
  yaml_path: data/yolo_job_ad_pivot_v3_tiles/dataset.yaml

train:
  model: yolov8n.pt
  epochs: 24
  imgsz: 896
  batch: 4
  device: auto
  workers: 2
  seed: 20260407
  project: artifacts/detector_pivot_yolo_v3_tiles/runs
  name: baseline_v3
  pretrained: true
  cache: false
  deterministic: true
  patience: 20
  close_mosaic: 10
  optimizer: auto
  lr0: 0.01
  verbose: true

inference:
  model_path: artifacts/detector_pivot_yolo_v3_tiles/best.pt
  conf_threshold: 0.022
  iou_threshold: 0.5
  max_det: 1500
  imgsz: 1024
  device: auto
