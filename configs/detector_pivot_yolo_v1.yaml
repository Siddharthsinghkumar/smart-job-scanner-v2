dataset:
  yaml_path: data/yolo_job_ad_pivot_v1/dataset.yaml

train:
  model: yolov8n.pt
  epochs: 60
  imgsz: 960
  batch: 2
  device: auto
  workers: 2
  seed: 20260403
  project: artifacts/detector_pivot_yolo_v1/runs
  name: baseline
  pretrained: true
  cache: false
  deterministic: true
  patience: 20
  close_mosaic: 10
  optimizer: auto
  lr0: 0.01
  verbose: true

inference:
  model_path: artifacts/detector_pivot_yolo_v1/best.pt
  conf_threshold: 0.2
  iou_threshold: 0.5
  max_det: 400
  imgsz: 1024
  device: auto
