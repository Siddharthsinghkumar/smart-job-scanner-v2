dataset:
  yaml_path: data/yolo_job_ad_pivot_v2_tiles/dataset.yaml

train:
  model: yolov8n.pt
  epochs: 20
  imgsz: 896
  batch: 4
  device: auto
  workers: 2
  seed: 20260404
  project: artifacts/detector_pivot_yolo_v2_tiles/runs
  name: baseline
  pretrained: true
  cache: false
  deterministic: true
  patience: 20
  close_mosaic: 10
  optimizer: auto
  lr0: 0.01
  verbose: true

inference:
  model_path: artifacts/detector_pivot_yolo_v2_tiles/best.pt
  conf_threshold: 0.005
  iou_threshold: 0.5
  max_det: 1200
  imgsz: 1024
  device: auto
